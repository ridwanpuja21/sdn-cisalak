<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Berita - SDN Cisalak</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #0f172a;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
      }
      .detail-container {
        max-width: 700px;
        width: 100%;
        background-color: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 40px;
        border-radius: 16px;
      }
      .back-btn {
        display: inline-block;
        color: #ffd700;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 25px;
      }
      .detail-date {
        color: #94a3b8;
        font-size: 13px;
        margin-bottom: 10px;
      }
      .detail-title {
        font-size: 28px;
        margin-bottom: 20px;
        line-height: 1.3;
      }
      /* Styling Gambar Berita */
      .detail-image {
        width: 100%;
        height: 800px;
        object-fit: cover;
        border-radius: 12px;
        margin-bottom: 25px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .detail-content {
        color: #cbd5e1;
        font-size: 16px;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <div class="detail-container">
      <a href="index.html#card-6" class="back-btn">&larr; Kembali ke Beranda</a>
      <div id="news-detail-content">
        <p>Memuat berita...</p>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const urlParams = new URLSearchParams(window.location.search);
        const newsId = urlParams.get("id");
        const container = document.getElementById("news-detail-content");

        if (!newsId) {
          container.innerHTML = "<p>Berita tidak ditemukan.</p>";
          return;
        }

        fetch("berita.json")
          .then((response) => response.json())
          .then((data) => {
            const news = data.find((item) => item.id === newsId);
            if (news) {
              // Menampilkan gambar secara opsional jika properti gambar tersedia
              const imgTag = news.gambar
                ? `<img src="${news.gambar}" alt="${news.judul}" class="detail-image" />`
                : "";

              container.innerHTML = `
                <div class="detail-date">${news.tanggal}</div>
                <h1 class="detail-title">${news.judul}</h1>
                ${imgTag}
                <div class="detail-content">${news.isi}</div>
              `;
              document.title = `${news.judul} - SDN Cisalak`;
            } else {
              container.innerHTML = "<p>Berita tidak ditemukan.</p>";
            }
          })
          .catch((err) => {
            console.error(err);
            container.innerHTML = "<p>Gagal memuat berita.</p>";
          });
      });
    </script>
  </body>
</html>
