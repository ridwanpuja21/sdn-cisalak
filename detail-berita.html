<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Berita - SDN Cisalak</title>

    <link rel="stylesheet" href="style.css" />

    <style>
      body {
        background-color: #0f172a;
        color: #cbd5e1;
        padding: 0;
      }
      .article-container {
        max-width: 800px;
        margin: 60px auto;
        padding: 30px;
        background-color: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
      }
      .back-btn {
        display: inline-block;
        margin-bottom: 30px;
        color: #ffd700;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        transition: opacity 0.3s;
      }
      .back-btn:hover {
        opacity: 0.8;
      }
      .article-title {
        color: #ffffff;
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 15px;
        line-height: 1.3;
      }
      .article-date {
        color: #94a3b8;
        font-size: 14px;
        margin-bottom: 40px;
        padding-bottom: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .article-content {
        font-size: 16px;
        line-height: 1.8;
        color: #e2e8f0;
      }
      /* Memastikan gambar dari blogger tidak melebih batas layar (responsif) */
      .article-content img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        margin: 20px 0;
      }
      .article-content iframe {
        max-width: 100%;
      }

      @media (max-width: 768px) {
        .article-container {
          margin: 20px;
          padding: 20px;
        }
        .article-title {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="article-container" id="konten-artikel">
      <a href="index.html" class="back-btn">&larr; Kembali ke Beranda</a>
      <p style="color: #94a3b8; text-align: center">Memuat konten berita...</p>
    </div>

    <script>
      // 1. Tangkap parameter "id" dari URL (misal: detail-berita.html?id=123456789)
      const urlParams = new URLSearchParams(window.location.search);
      const postId = urlParams.get("id");

      // 2. Fungsi untuk merakit dan menampilkan data dari Blogger
      function tampilkanDetail(data) {
        const container = document.getElementById("konten-artikel");
        const post = data.entry;

        // Jika data tidak ditemukan
        if (!post) {
          container.innerHTML = `
          <a href="index.html" class="back-btn">&larr; Kembali ke Beranda</a>
          <p style="color:#ef4444; text-align:center;">Berita tidak ditemukan atau sudah dihapus.</p>
        `;
          return;
        }

        // Ambil Judul, Tanggal, dan Isi Konten
        const title = post.title.$t;
        const dateObj = new Date(post.published.$t);
        const dateStr = dateObj.toLocaleDateString("id-ID", {
          day: "numeric",
          month: "long",
          year: "numeric",
        });

        // Mengambil isi utuh beserta gambar dan tag HTML asli dari Blogger
        const content = post.content ? post.content.$t : "";

        // Cetak ke layar
        container.innerHTML = `
        <a href="index.html" class="back-btn">&larr; Kembali ke Beranda</a>
        <h1 class="article-title">${title}</h1>
        <div class="article-date">Diterbitkan pada: ${dateStr}</div>
        <div class="article-content">${content}</div>
      `;
      }

      // 3. Panggil data langsung dari server Blogger menggunakan ID secara dinamis
      if (postId) {
        const scriptBlogger = document.createElement("script");
        // Memanggil API Blogger khusus untuk 1 Post ID saja (menghindari CORS)
        scriptBlogger.src = `https://sdn-cisalak.blogspot.com/feeds/posts/default/${postId}?alt=json-in-script&callback=tampilkanDetail`;

        // Masukkan script ke dalam halaman untuk dijalankan
        document.body.appendChild(scriptBlogger);
      } else {
        document.getElementById("konten-artikel").innerHTML = `
        <a href="index.html" class="back-btn">&larr; Kembali</a>
        <p style="text-align:center;">URL tidak valid. ID Berita tidak ditemukan.</p>
      `;
      }
    </script>
  </body>
</html>
